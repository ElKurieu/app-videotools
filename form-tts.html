<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Image Video Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #0f0f13; color: #e8e8f0; min-height: 100vh; padding: 24px 16px; }
  h1 { text-align: center; font-size: 1.6rem; font-weight: 700; margin-bottom: 6px;
       background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text;
       -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: #888; font-size: .9rem; margin-bottom: 28px; }
  .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 14px;
          max-width: 640px; margin: 0 auto; padding: 28px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab { flex: 1; padding: 10px; border: 1px solid #2a2a3a; border-radius: 8px;
         background: transparent; color: #888; cursor: pointer; font-size: .9rem;
         transition: all .2s; text-align: center; }
  .tab.active { background: #6d28d9; border-color: #7c3aed; color: #fff; font-weight: 600; }
  .tab:hover:not(.active) { border-color: #4a4a6a; color: #ccc; }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  /* Champs */
  .field { margin-bottom: 18px; }
  label { display: block; font-size: .83rem; color: #a0a0b8; margin-bottom: 6px;
          font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
  textarea, input, select {
    width: 100%; padding: 11px 14px; background: #12121a;
    border: 1px solid #2a2a3a; border-radius: 8px; color: #e8e8f0;
    font-size: .95rem; outline: none; transition: border-color .2s;
  }
  textarea:focus, input:focus, select:focus { border-color: #7c3aed; }
  textarea { resize: vertical; min-height: 130px; font-family: inherit; line-height: 1.5; }
  select option { background: #1a1a24; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* Helper texte */
  .hint { font-size: .78rem; color: #666; margin-top: 5px; }

  /* Bouton */
  .btn { width: 100%; padding: 13px; border: none; border-radius: 9px;
         background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff;
         font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .2s;
         margin-top: 4px; letter-spacing: .02em; }
  .btn:hover:not(:disabled) { opacity: .85; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Status */
  #status { margin-top: 24px; padding: 16px; border-radius: 10px;
            background: #12121a; border: 1px solid #2a2a3a; display: none; }
  #status.show { display: block; }
  .status-row { display: flex; align-items: center; gap: 10px; }
  .spinner { width: 18px; height: 18px; border: 2px solid #333;
             border-top-color: #7c3aed; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text { font-size: .95rem; color: #c0c0d8; }
  .job-id { font-size: .75rem; color: #555; margin-top: 6px; font-family: monospace; }

  .result-box { background: #0d1f0d; border: 1px solid #1a4a1a;
                border-radius: 8px; padding: 14px; margin-top: 10px; }
  .result-box a { color: #4ade80; text-decoration: none; font-weight: 600; font-size: .95rem; }
  .result-box a:hover { text-decoration: underline; }
  .result-label { font-size: .75rem; color: #555; margin-bottom: 4px; }

  .error-box { background: #200d0d; border: 1px solid #4a1a1a;
               border-radius: 8px; padding: 14px; margin-top: 10px; }
  .error-box p { color: #f87171; font-size: .9rem; }

  /* Badge voix */
  .voice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .voice-btn { padding: 8px; border: 1px solid #2a2a3a; border-radius: 7px;
               background: transparent; color: #888; cursor: pointer; font-size: .82rem;
               text-align: center; transition: all .18s; }
  .voice-btn.sel { border-color: #7c3aed; background: #1e1030; color: #c4b5fd; font-weight: 600; }
  .voice-btn:hover:not(.sel) { border-color: #4a4a6a; color: #ccc; }
</style>
</head>
<body>

<h1>🎬 TTS Image Video Generator</h1>
<p class="subtitle">Texte ou document → Voix + Images Pexels → Vidéo 9:16 → Google Drive</p>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('text')">✏️ Texte direct</button>
    <button class="tab" onclick="switchTab('drive')">📁 Fichier Drive</button>
  </div>

  <!-- Onglet Texte -->
  <div class="panel active" id="panel-text">
    <div class="field">
      <label>Texte à lire</label>
      <textarea id="input-text" placeholder="Colle ici le texte à transformer en vidéo...&#10;&#10;La nature est une source infinie d'inspiration. Les forêts, les océans et les montagnes nous rappellent la beauté du monde."></textarea>
      <p class="hint">Idéalement 50–300 mots pour une vidéo de 30–90 secondes.</p>
    </div>
  </div>

  <!-- Onglet Drive -->
  <div class="panel" id="panel-drive">
    <div class="field">
      <label>ID ou URL du fichier Google Drive</label>
      <input type="text" id="input-drive" placeholder="1aBcDeFgHiJkLmNoPqRsTuVwXyZ ou URL Drive complète">
      <p class="hint">Le fichier doit être accessible par le compte Drive connecté à n8n.</p>
    </div>
    <div class="field">
      <label>Type de fichier</label>
      <select id="input-filetype">
        <option value="pdf">PDF (.pdf)</option>
        <option value="docx">Word (.docx)</option>
        <option value="txt">Texte (.txt)</option>
      </select>
    </div>
  </div>

  <!-- Paramètres communs -->
  <div class="field" style="margin-top:8px">
    <label>Voix OpenAI TTS</label>
    <div class="voice-grid" id="voice-grid">
      <button class="voice-btn sel" onclick="selectVoice('alloy',this)">Alloy</button>
      <button class="voice-btn" onclick="selectVoice('nova',this)">Nova</button>
      <button class="voice-btn" onclick="selectVoice('echo',this)">Echo</button>
      <button class="voice-btn" onclick="selectVoice('fable',this)">Fable</button>
      <button class="voice-btn" onclick="selectVoice('onyx',this)">Onyx</button>
      <button class="voice-btn" onclick="selectVoice('shimmer',this)">Shimmer</button>
    </div>
  </div>
  <div class="field">
    <label>Titre de la vidéo</label>
    <input type="text" id="input-titre" placeholder="nature_video" value="tts_video">
    <p class="hint">Utilisé comme nom du fichier sur Google Drive.</p>
  </div>

  <button class="btn" id="submit-btn" onclick="submitJob()">🚀 Générer la vidéo</button>

  <div id="status">
    <div class="status-row">
      <div class="spinner" id="spinner"></div>
      <div class="status-text" id="status-text">Traitement en cours...</div>
    </div>
    <div class="job-id" id="job-id-display"></div>
    <div id="result-area"></div>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://n8n.srv1037761.hstgr.cloud/webhook/tts-imagevideo';
const SHEET_ID    = '1gjWtn2q3GkTPesYmcV1u5z0EDRRIxP_wFTx8-aoVGWc';
const SHEET_TAB   = 'tts_jobs';

let currentTab  = 'text';
let selectedVoice = 'alloy';
let pollInterval  = null;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['text','drive'][i] === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
}

function selectVoice(v, el) {
  selectedVoice = v;
  document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
}

function extractDriveId(raw) {
  const m = raw.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{20,}$/.test(raw.trim())) return raw.trim();
  return raw.trim();
}

async function submitJob() {
  const btn   = document.getElementById('submit-btn');
  const titre = (document.getElementById('input-titre').value.trim() || 'tts_video')
                  .replace(/[^a-zA-Z0-9_\-]/g,'_');

  let payload = { voix: selectedVoice, titre };

  if (currentTab === 'text') {
    const text = document.getElementById('input-text').value.trim();
    if (!text) { alert('Merci de saisir un texte.'); return; }
    payload.text = text;
  } else {
    const raw  = document.getElementById('input-drive').value.trim();
    const ftype = document.getElementById('input-filetype').value;
    if (!raw) { alert('Merci de saisir l\'ID ou l\'URL du fichier Drive.'); return; }
    payload.driveFileId = extractDriveId(raw);
    payload.fileName    = titre + '.' + ftype;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Envoi en cours...';
  setStatus('Envoi de la requête...', false);

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    const jobId = data.jobId;
    if (!jobId) throw new Error('jobId absent de la réponse');

    document.getElementById('job-id-display').textContent = 'Job : ' + jobId;
    setStatus('Vidéo en cours de génération…', true);
    btn.textContent = '⏳ Génération en cours...';
    startPolling(jobId);
  } catch(e) {
    setStatus('Erreur lors de l\'envoi : ' + e.message, false, true);
    btn.disabled = false;
    btn.textContent = '🚀 Générer la vidéo';
  }
}

function setStatus(msg, spinning, isError = false) {
  const box = document.getElementById('status');
  box.classList.add('show');
  document.getElementById('status-text').textContent = msg;
  document.getElementById('spinner').style.display   = spinning ? 'block' : 'none';
  document.getElementById('result-area').innerHTML   = '';
  if (isError) document.getElementById('spinner').style.display = 'none';
}

function startPolling(jobId) {
  let attempts = 0;
  const maxAttempts = 60; // 2 minutes max
  pollInterval = setInterval(async () => {
    attempts++;
    if (attempts > maxAttempts) {
      clearInterval(pollInterval);
      setStatus('Délai dépassé — vérifiez les logs n8n.', false, true);
      resetBtn();
      return;
    }
    const row = await getJobRow(jobId);
    if (!row) return;
    const status = row.status || '';
    if (status === 'done') {
      clearInterval(pollInterval);
      setStatus('✅ Vidéo générée avec succès !', false);
      document.getElementById('result-area').innerHTML = `
        <div class="result-box">
          <div class="result-label">Fichier sur Google Drive</div>
          <a href="${row.driveUrl}" target="_blank">🎬 Ouvrir la vidéo</a>
        </div>`;
      resetBtn();
    } else if (status === 'error') {
      clearInterval(pollInterval);
      setStatus('❌ Erreur lors de la génération', false);
      document.getElementById('result-area').innerHTML = `
        <div class="error-box"><p>${row.errorMsg || 'Erreur inconnue'}</p></div>`;
      resetBtn();
    } else {
      document.getElementById('status-text').textContent =
        `En cours… (${attempts * 2}s)`;
    }
  }, 2000);
}

async function getJobRow(jobId) {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB)}&t=${Date.now()}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, ''));
    const rows = json.table?.rows || [];
    const cols = json.table?.cols?.map(c => c.label.toLowerCase()) || [];
    const iJobId = cols.indexOf('jobid');
    const iStatus = cols.indexOf('status');
    const iDrive  = cols.indexOf('driveurl');
    const iErr    = cols.indexOf('errormsg');
    for (const row of rows) {
      const cells = row.c || [];
      const val   = cells[iJobId]?.v || '';
      if (val === jobId) {
        return {
          status:   cells[iStatus]?.v || '',
          driveUrl: cells[iDrive]?.v  || '',
          errorMsg: cells[iErr]?.v    || ''
        };
      }
    }
  } catch(e) { /* ignore */ }
  return null;
}

function resetBtn() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  btn.textContent = '🚀 Générer la vidéo';
}
</script>
</body>
</html>
