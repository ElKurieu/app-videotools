<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Traduction FR ↔ RO</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111;
    --card2: #181818;
    --gold: #D4AF37;
    --gold-dim: #b8962e;
    --text: #e8e8e8;
    --text-dim: #888;
    --border: #2a2a2a;
    --success: #2d6a4f;
    --error: #7b2d2d;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* NAV */
  nav {
    background: rgba(10,10,10,0.95);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .nav-brand { font-size: 1.1rem; font-weight: 700; color: var(--gold); text-decoration: none; }
  .nav-back { color: var(--text-dim); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
  .nav-back:hover { color: var(--gold); }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 1rem;
    gap: 0;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  /* PANELS */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 220px;
    transition: border-color 0.2s;
  }
  .panel.active { border-color: var(--gold); }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .lang-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--gold);
  }
  .lang-flag { font-size: 1.2rem; }

  .panel-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .icon-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1rem;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
  .icon-btn.recording {
    border-color: #e74c3c;
    color: #e74c3c;
    animation: pulse 1s infinite;
  }
  .icon-btn.copied { border-color: var(--success); color: #4ade80; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.1rem;
    line-height: 1.6;
    padding: 1rem;
    resize: none;
    outline: none;
    width: 100%;
    font-family: inherit;
    min-height: 140px;
  }
  textarea::placeholder { color: #444; }
  textarea:disabled { cursor: default; }

  .char-count {
    padding: 0.4rem 1rem;
    font-size: 0.75rem;
    color: #444;
    text-align: right;
    border-top: 1px solid var(--border);
  }

  /* SWAP BAR */
  .swap-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0;
    position: relative;
  }

  .swap-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1.1rem;
    z-index: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .swap-btn:hover { border-color: var(--gold); color: var(--gold); transform: rotate(180deg); }

  /* STATUS */
  .status-bar {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    padding: 0.5rem 0;
    min-height: 1.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .status-bar.translating { color: var(--gold); }
  .status-bar.error { color: #f87171; }

  .spinner-sm {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(212,175,55,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* BOTTOM TRANSLATE BTN */
  .translate-btn {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
    border: none;
    border-radius: 8px;
    color: #000;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
    -webkit-tap-highlight-color: transparent;
  }
  .translate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .translate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* NO SPEECH SUPPORT */
  .no-speech-hint {
    font-size: 0.75rem;
    color: #555;
    text-align: center;
    padding: 0.5rem 0;
    display: none;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--text-dim);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">🎬 VideoTools</a>
  <a class="nav-back" href="index.html">← Accueil</a>
</nav>

<main>

  <!-- PANEL HAUT (source) -->
  <div class="panel" id="panel-top">
    <div class="panel-header">
      <div class="lang-label">
        <span class="lang-flag" id="flag-top">🇫🇷</span>
        <span id="lang-top">Français</span>
      </div>
      <div class="panel-actions">
        <button class="icon-btn" id="mic-btn" title="Dicter" onclick="toggleMic()">🎤</button>
        <button class="icon-btn" title="Effacer" onclick="clearSource()">✕</button>
      </div>
    </div>
    <textarea id="source-text"
      placeholder="Écrivez ici ou utilisez le micro…"
      maxlength="2000"
      oninput="onSourceInput()"
      onfocus="document.getElementById('panel-top').classList.add('active')"
      onblur="document.getElementById('panel-top').classList.remove('active')"
    ></textarea>
    <div class="char-count"><span id="char-count">0</span> / 2000</div>
  </div>

  <!-- BARRE DE SWAP -->
  <div class="swap-bar">
    <button class="swap-btn" onclick="swapLanguages()" title="Inverser les langues">⇅</button>
  </div>

  <!-- STATUT -->
  <div class="status-bar" id="status-bar"></div>

  <!-- PANEL BAS (résultat) -->
  <div class="panel" id="panel-bottom">
    <div class="panel-header">
      <div class="lang-label">
        <span class="lang-flag" id="flag-bottom">🇷🇴</span>
        <span id="lang-bottom">Roumain</span>
      </div>
      <div class="panel-actions">
        <button class="icon-btn" id="copy-btn" title="Copier" onclick="copyTranslation()">📋</button>
        <button class="icon-btn" id="speak-btn" title="Lire à voix haute" onclick="speakTranslation()">🔊</button>
      </div>
    </div>
    <textarea id="result-text"
      placeholder="La traduction apparaîtra ici…"
      readonly
    ></textarea>
  </div>

  <div class="no-speech-hint" id="no-speech-hint">
    Dictée vocale non disponible sur ce navigateur.
  </div>

  <button class="translate-btn" id="translate-btn" onclick="translateNow()" disabled>
    Traduire
  </button>

</main>

<footer>
  <a href="index.html">VideoTools</a> · Traduction FR ↔ RO
</footer>

<script>
const WEBHOOK = 'https://n8n.srv1037761.hstgr.cloud/webhook/translate';

const langs = [
  { code: 'fr', label: 'Français', flag: '🇫🇷', speechCode: 'fr-FR' },
  { code: 'ro', label: 'Roumain',  flag: '🇷🇴', speechCode: 'ro-RO' }
];
let topLangIdx = 0; // 0=FR, 1=RO
let debounceTimer = null;
let isRecording = false;
let recognition = null;
let lastTranslated = '';

// --- Init Web Speech API ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  document.getElementById('mic-btn').style.display = 'none';
  document.getElementById('no-speech-hint').style.display = 'block';
}

function sourceLang() { return langs[topLangIdx]; }
function targetLang() { return langs[1 - topLangIdx]; }

function updateLangUI() {
  const s = sourceLang(), t = targetLang();
  document.getElementById('flag-top').textContent   = s.flag;
  document.getElementById('lang-top').textContent   = s.label;
  document.getElementById('flag-bottom').textContent = t.flag;
  document.getElementById('lang-bottom').textContent = t.label;
  document.getElementById('source-text').placeholder =
    s.code === 'fr' ? 'Écrivez ici ou utilisez le micro…'
                    : 'Scrieți aici sau folosiți microfonul…';
}

function swapLanguages() {
  topLangIdx = 1 - topLangIdx;
  updateLangUI();
  // Swap le texte des deux zones
  const src = document.getElementById('source-text');
  const res = document.getElementById('result-text');
  const tmp = src.value;
  src.value = res.value;
  res.value = tmp;
  updateCharCount();
  lastTranslated = '';
  if (src.value.trim()) scheduleTranslation();
}

// --- Saisie texte ---
function onSourceInput() {
  updateCharCount();
  updateTranslateBtn();
  scheduleTranslation();
}

function updateCharCount() {
  const v = document.getElementById('source-text').value;
  document.getElementById('char-count').textContent = v.length;
}

function updateTranslateBtn() {
  const v = document.getElementById('source-text').value.trim();
  document.getElementById('translate-btn').disabled = !v;
}

function scheduleTranslation() {
  clearTimeout(debounceTimer);
  const txt = document.getElementById('source-text').value.trim();
  if (!txt) {
    document.getElementById('result-text').value = '';
    setStatus('');
    return;
  }
  debounceTimer = setTimeout(translateNow, 700);
}

function clearSource() {
  document.getElementById('source-text').value = '';
  document.getElementById('result-text').value = '';
  updateCharCount();
  updateTranslateBtn();
  setStatus('');
  lastTranslated = '';
}

// --- Traduction ---
async function translateNow() {
  const txt = document.getElementById('source-text').value.trim();
  if (!txt || txt === lastTranslated) return;

  setStatus('translating', '');
  document.getElementById('translate-btn').disabled = true;

  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, from: sourceLang().code, to: targetLang().code })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('result-text').value = data.translation || '';
    lastTranslated = txt;
    setStatus('');
  } catch (e) {
    setStatus('error', 'Erreur de traduction. Vérifiez votre connexion.');
  } finally {
    document.getElementById('translate-btn').disabled =
      !document.getElementById('source-text').value.trim();
  }
}

function setStatus(type, msg) {
  const bar = document.getElementById('status-bar');
  bar.className = 'status-bar' + (type ? ' ' + type : '');
  if (type === 'translating') {
    bar.innerHTML = '<span class="spinner-sm"></span> Traduction en cours…';
  } else if (type === 'error') {
    bar.textContent = msg;
  } else {
    bar.textContent = '';
  }
}

// --- Micro ---
function toggleMic() {
  if (isRecording) {
    stopMic();
  } else {
    startMic();
  }
}

function startMic() {
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = sourceLang().speechCode;
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-btn').textContent = '⏹';
    setStatus('translating', '');
    document.getElementById('status-bar').innerHTML =
      '<span class="spinner-sm"></span> Écoute en cours…';
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    const src = document.getElementById('source-text');
    if (final) {
      src.value = (src.value + ' ' + final).trim();
      updateCharCount();
      scheduleTranslation();
    } else if (interim) {
      // Affichage temporaire du texte intermédiaire dans le statut
      setStatus('translating', '');
      document.getElementById('status-bar').innerHTML =
        '<span class="spinner-sm"></span> ' + interim;
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'aborted') setStatus('error', 'Micro inaccessible : ' + e.error);
    stopMic();
  };

  recognition.onend = () => { stopMic(); };

  recognition.start();
}

function stopMic() {
  isRecording = false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').textContent = '🎤';
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  if (!document.getElementById('source-text').value.trim()) setStatus('');
}

// --- Copier ---
function copyTranslation() {
  const txt = document.getElementById('result-text').value;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1500);
  });
}

// --- Synthèse vocale ---
function speakTranslation() {
  const txt = document.getElementById('result-text').value;
  if (!txt || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(txt);
  utt.lang = targetLang().speechCode;
  window.speechSynthesis.speak(utt);
}

// Init
updateLangUI();
</script>
</body>
</html>
