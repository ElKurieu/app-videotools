<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Traduction FR · EN · RO</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111;
    --card2: #181818;
    --gold: #D4AF37;
    --gold-dim: #b8962e;
    --text: #e8e8e8;
    --text-dim: #888;
    --border: #2a2a2a;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  nav {
    background: rgba(10,10,10,0.95);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .nav-brand { font-size: 1.1rem; font-weight: 700; color: var(--gold); text-decoration: none; }
  .nav-back  { color: var(--text-dim); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
  .nav-back:hover { color: var(--gold); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 1rem;
    gap: 0;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  /* ── PANEL ── */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 200px;
    transition: border-color 0.2s;
  }
  .panel.active { border-color: var(--gold); }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--border);
    gap: 0.5rem;
  }

  /* ── SÉLECTEUR DE LANGUE ── */
  .lang-picker {
    display: flex;
    gap: 4px;
  }
  .lang-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text-dim);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .lang-pill:hover { border-color: var(--gold); color: var(--text); }
  .lang-pill.active {
    background: rgba(212,175,55,0.12);
    border-color: var(--gold);
    color: var(--gold);
  }
  .lang-pill .flag { font-size: 1rem; }

  .panel-actions {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    flex-shrink: 0;
  }

  .icon-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95rem;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
  .icon-btn.recording { border-color: #e74c3c; color: #e74c3c; animation: pulse 1s infinite; }
  .icon-btn.copied    { border-color: #2d6a4f; color: #4ade80; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.1rem;
    line-height: 1.6;
    padding: 1rem;
    resize: none;
    outline: none;
    width: 100%;
    font-family: inherit;
    min-height: 120px;
  }
  textarea::placeholder { color: #444; }

  .char-count {
    padding: 0.35rem 1rem;
    font-size: 0.72rem;
    color: #444;
    text-align: right;
    border-top: 1px solid var(--border);
  }

  /* ── SWAP BAR ── */
  .swap-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.4rem 0;
  }
  .swap-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1.1rem;
    -webkit-tap-highlight-color: transparent;
  }
  .swap-btn:hover { border-color: var(--gold); color: var(--gold); transform: rotate(180deg); }

  /* ── STATUS ── */
  .status-bar {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    padding: 0.4rem 0;
    min-height: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .status-bar.translating { color: var(--gold); }
  .status-bar.error       { color: #f87171; }

  .spinner-sm {
    width: 13px; height: 13px;
    border: 2px solid rgba(212,175,55,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── BOUTON TRADUIRE ── */
  .translate-btn {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
    border: none;
    border-radius: 8px;
    color: #000;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
    -webkit-tap-highlight-color: transparent;
  }
  .translate-btn:hover    { opacity: 0.9; transform: translateY(-1px); }
  .translate-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .no-speech-hint {
    font-size: 0.75rem; color: #555;
    text-align: center; padding: 0.4rem 0; display: none;
  }

  /* ── VOICE SELECTOR ── */
  .voice-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    border-top: 1px solid var(--border);
    background: var(--card2);
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .voice-bar label {
    font-size: 0.75rem;
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .voice-select {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.8rem;
    padding: 4px 8px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .voice-select:focus { border-color: var(--gold); }
  .voice-bar.hidden { display: none; }

  footer {
    text-align: center;
    padding: 1.2rem;
    color: var(--text-dim);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">🎬 VideoTools</a>
  <a class="nav-back" href="index.html">← Accueil</a>
</nav>

<main>

  <!-- PANEL SOURCE -->
  <div class="panel" id="panel-top">
    <div class="panel-header">
      <div class="lang-picker" id="picker-top"></div>
      <div class="panel-actions">
        <button class="icon-btn" id="mic-btn" title="Dicter" onclick="toggleMic()">🎤</button>
        <button class="icon-btn" title="Effacer" onclick="clearSource()">✕</button>
      </div>
    </div>
    <textarea id="source-text"
      placeholder="Écrivez ici ou utilisez le micro…"
      maxlength="2000"
      oninput="onSourceInput()"
      onfocus="document.getElementById('panel-top').classList.add('active')"
      onblur="document.getElementById('panel-top').classList.remove('active')"
    ></textarea>
    <div class="char-count"><span id="char-count">0</span> / 2000</div>
  </div>

  <!-- SWAP -->
  <div class="swap-bar">
    <button class="swap-btn" onclick="swapLanguages()" title="Inverser les langues">⇅</button>
  </div>

  <!-- STATUS -->
  <div class="status-bar" id="status-bar"></div>

  <!-- PANEL RÉSULTAT -->
  <div class="panel" id="panel-bottom">
    <div class="panel-header">
      <div class="lang-picker" id="picker-bottom"></div>
      <div class="panel-actions">
        <button class="icon-btn" id="copy-btn"  title="Copier"          onclick="copyTranslation()">📋</button>
        <button class="icon-btn" id="speak-btn" title="Lire à voix haute" onclick="speakTranslation()">🔊</button>
      </div>
    </div>
    <textarea id="result-text" placeholder="La traduction apparaîtra ici…" readonly></textarea>
    <div class="voice-bar hidden" id="voice-bar">
      <label>🔊 Voix :</label>
      <select class="voice-select" id="voice-select" onchange="onVoiceChange()"></select>
    </div>
  </div>

  <div class="no-speech-hint" id="no-speech-hint">
    Dictée vocale non disponible sur ce navigateur.
  </div>

  <button class="translate-btn" id="translate-btn" onclick="translateNow()" disabled>
    Traduire
  </button>

</main>

<footer>
  <a href="index.html">VideoTools</a> · Traduction FR · EN · RO
</footer>

<script>
const WEBHOOK = 'https://n8n.srv1037761.hstgr.cloud/webhook/translate';

const LANGS = [
  { code: 'fr', label: 'Français', short: 'FR', flag: '🇫🇷', speech: 'fr-FR' },
  { code: 'en', label: 'English',  short: 'EN', flag: '🇬🇧', speech: 'en-US' },
  { code: 'ro', label: 'Română',   short: 'RO', flag: '🇷🇴', speech: 'ro-RO' }
];

// État : srcIdx = index dans LANGS de la langue source, tgtIdx = cible
let srcIdx = 0; // FR par défaut
let tgtIdx = 2; // RO par défaut
let debounceTimer = null;
let isRecording = false;
let recognition = null;
let lastTranslated = '';

// ── Web Speech API ──
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  document.getElementById('mic-btn').style.display = 'none';
  document.getElementById('no-speech-hint').style.display = 'block';
}

// ── Rendu des sélecteurs ──
function renderPickers() {
  renderVoiceSelector();
  ['top', 'bottom'].forEach(side => {
    const isSrc = side === 'top';
    const activeIdx = isSrc ? srcIdx : tgtIdx;
    const picker = document.getElementById('picker-' + side);
    picker.innerHTML = '';
    LANGS.forEach((l, i) => {
      const btn = document.createElement('button');
      btn.className = 'lang-pill' + (i === activeIdx ? ' active' : '');
      btn.innerHTML = `<span class="flag">${l.flag}</span>${l.short}`;
      btn.onclick = () => selectLang(side, i);
      picker.appendChild(btn);
    });
  });
  // Placeholder source
  document.getElementById('source-text').placeholder =
    LANGS[srcIdx].code === 'fr' ? 'Écrivez ici ou utilisez le micro…' :
    LANGS[srcIdx].code === 'en' ? 'Type here or use the microphone…' :
                                   'Scrieți aici sau folosiți microfonul…';
}

function selectLang(side, idx) {
  if (side === 'top') {
    if (idx === tgtIdx) {
      // Évite conflit : swap automatique
      tgtIdx = srcIdx;
    }
    srcIdx = idx;
  } else {
    if (idx === srcIdx) {
      srcIdx = tgtIdx;
    }
    tgtIdx = idx;
  }
  renderPickers();
  lastTranslated = '';
  const txt = document.getElementById('source-text').value.trim();
  if (txt) scheduleTranslation();
}

function swapLanguages() {
  [srcIdx, tgtIdx] = [tgtIdx, srcIdx];
  renderPickers();
  const src = document.getElementById('source-text');
  const res = document.getElementById('result-text');
  const tmp = src.value;
  src.value = res.value;
  res.value = tmp;
  updateCharCount();
  lastTranslated = '';
  if (src.value.trim()) scheduleTranslation();
}

// ── Saisie ──
function onSourceInput() {
  updateCharCount();
  updateTranslateBtn();
  scheduleTranslation();
}

function updateCharCount() {
  document.getElementById('char-count').textContent =
    document.getElementById('source-text').value.length;
}

function updateTranslateBtn() {
  document.getElementById('translate-btn').disabled =
    !document.getElementById('source-text').value.trim();
}

function scheduleTranslation() {
  clearTimeout(debounceTimer);
  const txt = document.getElementById('source-text').value.trim();
  if (!txt) {
    document.getElementById('result-text').value = '';
    setStatus('');
    return;
  }
  debounceTimer = setTimeout(translateNow, 700);
}

function clearSource() {
  document.getElementById('source-text').value = '';
  document.getElementById('result-text').value = '';
  updateCharCount();
  updateTranslateBtn();
  setStatus('');
  lastTranslated = '';
}

// ── Traduction ──
async function translateNow() {
  const txt = document.getElementById('source-text').value.trim();
  if (!txt || txt === lastTranslated) return;

  setStatus('translating');
  document.getElementById('translate-btn').disabled = true;

  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, from: LANGS[srcIdx].code, to: LANGS[tgtIdx].code })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('result-text').value = data.translation || '';
    lastTranslated = txt;
    setStatus('');
  } catch (e) {
    setStatus('error', 'Erreur de traduction. Vérifiez votre connexion.');
  } finally {
    document.getElementById('translate-btn').disabled =
      !document.getElementById('source-text').value.trim();
  }
}

function setStatus(type, msg) {
  const bar = document.getElementById('status-bar');
  bar.className = 'status-bar' + (type ? ' ' + type : '');
  if (type === 'translating') {
    bar.innerHTML = '<span class="spinner-sm"></span> Traduction en cours…';
  } else if (type === 'error') {
    bar.textContent = msg || 'Erreur';
  } else {
    bar.textContent = '';
  }
}

// ── Micro ──
function toggleMic() { isRecording ? stopMic() : startMic(); }

function startMic() {
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = LANGS[srcIdx].speech;
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-btn').textContent = '⏹';
    document.getElementById('status-bar').className = 'status-bar translating';
    document.getElementById('status-bar').innerHTML =
      '<span class="spinner-sm"></span> Écoute en cours…';
  };

  recognition.onresult = (e) => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    const src = document.getElementById('source-text');
    if (final) {
      src.value = (src.value + ' ' + final).trim();
      updateCharCount();
      scheduleTranslation();
    } else if (interim) {
      document.getElementById('status-bar').innerHTML =
        '<span class="spinner-sm"></span> ' + interim;
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'aborted') setStatus('error', 'Micro inaccessible : ' + e.error);
    stopMic();
  };
  recognition.onend = () => stopMic();
  recognition.start();
}

function stopMic() {
  isRecording = false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').textContent = '🎤';
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  if (!document.getElementById('source-text').value.trim()) setStatus('');
}

// ── Copier ──
function copyTranslation() {
  const txt = document.getElementById('result-text').value;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1500);
  });
}

// ── Synthèse vocale + sélecteur de voix ──
let availableVoices = [];
let selectedVoice = null;
const voicePrefs = {}; // { 'fr-FR': voiceName, ... }

function loadVoices() {
  if (!window.speechSynthesis) return;
  availableVoices = window.speechSynthesis.getVoices();
  renderVoiceSelector();
}

function renderVoiceSelector() {
  const tgtLang = LANGS[tgtIdx];
  const bar = document.getElementById('voice-bar');
  const sel = document.getElementById('voice-select');

  // Filtrer les voix pour la langue cible (match sur les 2 premiers chars ex: "fr")
  const voices = availableVoices.filter(v =>
    v.lang.toLowerCase().startsWith(tgtLang.code) ||
    v.lang.toLowerCase().startsWith(tgtLang.speech.toLowerCase())
  );

  if (voices.length <= 1) {
    bar.classList.add('hidden');
    selectedVoice = voices[0] || null;
    return;
  }

  bar.classList.remove('hidden');
  sel.innerHTML = '';
  const savedName = voicePrefs[tgtLang.speech] || '';

  voices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    // Affichage lisible : nom + pays entre parenthèses
    const country = v.lang.split('-')[1] || '';
    opt.textContent = v.name + (country ? ' (' + country + ')' : '');
    if (v.name === savedName) opt.selected = true;
    sel.appendChild(opt);
  });

  // Sélectionner la voix sauvegardée ou la première
  selectedVoice = voices.find(v => v.name === savedName) || voices[0];
  sel.value = selectedVoice.name;
}

function onVoiceChange() {
  const sel = document.getElementById('voice-select');
  const tgtLang = LANGS[tgtIdx];
  selectedVoice = availableVoices.find(v => v.name === sel.value) || null;
  if (selectedVoice) voicePrefs[tgtLang.speech] = selectedVoice.name;
}

function speakTranslation() {
  const txt = document.getElementById('result-text').value;
  if (!txt || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(txt);
  if (selectedVoice) {
    utt.voice = selectedVoice;
    utt.lang  = selectedVoice.lang;
  } else {
    utt.lang = LANGS[tgtIdx].speech;
  }
  window.speechSynthesis.speak(utt);
}

// Init
renderPickers();

// Les voix sont chargées de manière asynchrone (surtout sur iOS)
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
</script>
</body>
</html>
